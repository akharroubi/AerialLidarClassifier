[flake8]
# 79 chars is the PEP 8 ideal but unrealistic for dense numerical /
# tensor code. 100 chars is the QGIS-codebase convention and is what
# we lint against locally.
max-line-length = 100
# E203 (whitespace before ':') conflicts with the black/PEP-8 slice
# convention; W503 (line break before binary operator) is the
# PEP-8-recommended style as of 2016. Both are ignored by most modern
# Python tooling.
extend-ignore = E203,W503
exclude =
    __pycache__,
    .git,
    build,
    dist,
