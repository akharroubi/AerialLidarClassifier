<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Aerial LiDAR Classifier</title>
  <defs>
    <pattern id="pts" width="4.60" height="9.20" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.85" fill="#fff" fill-opacity="0.25"/>
      <circle cx="2.30" cy="4.60" r="0.85" fill="#fff" fill-opacity="0.25"/>
    </pattern>
    <filter id="white"><feFlood flood-color="#fff"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <mask id="scene" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <use href="#shapes" filter="url(#white)"/>
    </mask>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <polygon points="50.00,3.00 7.00,80.00 93.00,80.00" fill="rgb(91,155,213)" fill-opacity="0.23" filter="url(#soft)"/>
  <g id="shapes">
    <rect x="41.00" y="6.30" width="18" height="2.4" rx="1.2" fill="#3B4A5A"/>
    <ellipse cx="50.50" cy="7.50" rx="5" ry="2.2" fill="#3B4A5A"/>
    <polygon points="45.50,3.00 48.00,3.00 49.00,7.50" fill="#3B4A5A"/>
    <rect x="4" y="78.00" width="92" height="17.00" rx="8.0" fill="#A87E55"/>
    <rect x="4" y="78.00" width="92" height="6" fill="#A87E55"/>
    <rect x="91.50" y="24.00" width="3.50" height="56.00" rx="1.2" fill="#FF00FF"/>
    <rect x="88.50" y="27.00" width="9.50" height="3.00" rx="1" fill="#FF00FF"/>
    <polyline points="3.00,29.00 25.00,35.50 50.00,36.50 75.00,32.50 93.25,27.50" fill="none" stroke="#FFA500" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="21.50" y="60.00" width="5.00" height="20.00" fill="#7A5A3A"/>
    <circle cx="24.00" cy="44.00" r="21.00" fill="#228B22"/>
    <circle cx="32.00" cy="53.00" r="14.00" fill="#3CA83C"/>
    <rect x="52.00" y="42.00" width="34.00" height="38.00" fill="#D62828"/>
    <polygon points="48.50,43.00 69.00,20.00 89.50,43.00" fill="#9E1B1B"/>
  </g>
  <rect x="0" y="0" width="100" height="100" fill="url(#pts)" mask="url(#scene)"/>
</svg>
